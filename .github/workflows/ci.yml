name: CI

on:
  # Nothing here reads Markdown, so a push or pull request that changes only
  # .md files has nothing to test
  push:
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev libpng-dev libjpeg-dev zlib1g-dev clang python3

      # The runner kernel's high mmap randomization breaks ASan's shadow
      # memory layout ("AddressSanitizer:DEADLYSIGNAL" at startup)
      - name: Let AddressSanitizer run
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Build (hardened release)
        run: make

      - name: Unit, CLI and fault-injection tests
        run: make test

  # The jobs run side by side, so CI takes as long as the slowest one: the
  # fuzzing and the C-against-Rust checks each get their own
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev libpng-dev libjpeg-dev zlib1g-dev clang python3

      - name: Let AddressSanitizer run
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Fuzz each target for a minute
        run: make fuzz FUZZ_TIME=60

      - name: Keep fuzzer crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: tests/build/fuzz/crash-*
          if-no-files-found: ignore

  # The Rust port must stay compatible with the C version: an image written by
  # one decodes with the other. So it runs the same CLI tests, and both
  # binaries read the same odd files (tests/differential.py).
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev libpng-dev libjpeg-dev zlib1g-dev libclang-dev pkg-config clang python3

      - name: Let AddressSanitizer run
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Build the C version (the reference) and the test fixture
        run: make && make tests/build/jpeg_fixture

      - name: Build the Rust version, with and without fault injection
        working-directory: rust
        run: |
          cargo build --release --locked
          cargo build --release --locked --features fault-injection --target-dir target/fault

      - name: Rust unit tests and fuzz regressions
        working-directory: rust
        run: cargo test --release --locked

      - name: CLI and fault-injection tests against the Rust binary
        env:
          JPEG_FIXTURE: tests/build/jpeg_fixture
        run: |
          R=$PWD/rust/target
          SCATTERSTEG=$R/release/scattersteg SCATTERSTEG_FAULT=$R/fault/release/scattersteg \
            FAULT_LONG_MIN=15 python3 tests/test_cli.py

  # Builds with the other distortion models (distortion.h), which the
  # default builds above never run: the C one with WOW and J-UNIWARD under
  # the sanitizers and fault sweeps, the Rust one with S-UNIWARD and
  # J-UNIWARD through the CLI tests
  models:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev libpng-dev libjpeg-dev zlib1g-dev libclang-dev pkg-config clang python3

      - name: Let AddressSanitizer run
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: C with WOW and J-UNIWARD
        run: make test PNG_COSTS=wow JPEG_COSTS=juniward

      - name: Rust with S-UNIWARD and J-UNIWARD
        env:
          SCATTERSTEG_PNG_COSTS: suniward
          SCATTERSTEG_JPEG_COSTS: juniward
          JPEG_FIXTURE: tests/build/jpeg_fixture
        run: |
          (cd rust && cargo build --release --locked)
          SCATTERSTEG=$PWD/rust/target/release/scattersteg python3 tests/test_cli.py

  differential:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev libpng-dev libjpeg-dev zlib1g-dev libclang-dev pkg-config clang python3

      - name: Build both versions and the test fixture
        run: |
          make && make tests/build/jpeg_fixture
          cd rust && cargo build --release --locked

      - name: C and Rust agree on what loads
        env:
          SCATTERSTEG_C: ./scattersteg
          SCATTERSTEG_RUST: rust/target/release/scattersteg
          JPEG_FIXTURE: tests/build/jpeg_fixture
        run: python3 tests/differential.py

  # One job per target, side by side
  rust-fuzz:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false  # a crash in one target shouldn't hide the others' results
      matrix:
        target: [png_load, jpeg_load, diff_png, diff_jpeg, diff_codec]
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev libpng-dev libjpeg-dev zlib1g-dev libclang-dev pkg-config clang python3

      - name: Build the test fixture (for the JPEG seeds)
        run: make tests/build/jpeg_fixture

      - name: Install the fuzzer
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --locked

      - name: Seed the fuzz corpora
        working-directory: rust
        run: |
          mkdir -p fuzz/corpus/png_load fuzz/corpus/jpeg_load fuzz/corpus/diff_png fuzz/corpus/diff_jpeg fuzz/corpus/diff_codec
          python3 ../tests/fuzz/make_seeds.py fuzz/corpus/png_load
          i=0
          for opts in "" progressive optimize arith restart markers nojfif 444; do
            for c in 1 3; do ../tests/build/jpeg_fixture fuzz/corpus/jpeg_load/seed$i.jpg 40 32 $c 85 $opts; i=$((i+1)); done
          done
          cp fuzz/regressions/png_load/* ../tests/fuzz/regressions/png_load/* fuzz/regressions/diff_png/* fuzz/corpus/png_load/
          cp fuzz/regressions/jpeg_load/* ../tests/fuzz/regressions/jpeg_load/* fuzz/corpus/jpeg_load/
          cp fuzz/corpus/png_load/* fuzz/corpus/diff_png/
          cp fuzz/corpus/jpeg_load/* fuzz/corpus/diff_jpeg/

      - name: Fuzz for a minute
        working-directory: rust
        env:
          T: ${{ matrix.target }}
        run: |
          case $T in
            diff_codec) cargo +nightly fuzz run $T -- -max_total_time=60 -rss_limit_mb=7000 -timeout=60; exit;;
            *png*) dict=fuzz/dicts/png.dict;;
            *) dict=fuzz/dicts/jpeg.dict;;
          esac
          cargo +nightly fuzz run $T -- -dict=$dict -max_total_time=60 -rss_limit_mb=7000 -max_len=20000 -timeout=60

      - name: Keep fuzzer crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rust-fuzz-crashes-${{ matrix.target }}
          path: rust/fuzz/artifacts/
          if-no-files-found: ignore
