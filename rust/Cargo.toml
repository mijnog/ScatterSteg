[package]
name = "scattersteg"
version = "0.1.0"
license = "MIT OR Apache-2.0"
edition = "2024"

[dependencies]
crc32fast = "1.5.3"
flate2 = "1.1.10"
libc = "0.2.191"
libsodium-sys-stable = { version = "1.24.3", features = ["use-pkg-config"] }
png = "0.17"
zeroize = "1.9.1"

[build-dependencies]
bindgen = "0.73.2"
pkg-config = "0.3.34"

[lints.rust]
# Set by cargo fuzz: swaps Argon2id for BLAKE2b (see sodium::pwhash)
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[features]
# Lets tests make the Nth faultable call fail (see src/fault.rs)
fault-injection = []
