[package]
name = "scattersteg-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
crc32fast = "1.5.3"
flate2 = { version = "1.1.10", features = ["zlib"] }
scattersteg = { path = ".." }
libc = "0.2"

[build-dependencies]
cc = "1"

[[bin]]
name = "png_load"
path = "fuzz_targets/png_load.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jpeg_load"
path = "fuzz_targets/jpeg_load.rs"
test = false
doc = false
bench = false

[[bin]]
name = "diff_png"
path = "fuzz_targets/diff_png.rs"
test = false
doc = false
bench = false

[[bin]]
name = "diff_jpeg"
path = "fuzz_targets/diff_jpeg.rs"
test = false
doc = false
bench = false

[workspace]
