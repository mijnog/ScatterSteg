version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
crc32fast = "1.5.3"
scattersteg = { path = ".." }

[[bin]]
name = "png_load"
